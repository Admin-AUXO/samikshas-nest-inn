name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh Airbnb rating and review count
        run: node tools/airbnb-stats.mjs
      - uses: withastro/action@v3
        with:
          node-version: 22
          package-manager: npm
        env:
          SITE_URL: https://admin-auxo.github.io
          BASE_PATH: /samikshas-nest-inn
          PUBLIC_NOINDEX: "true"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
